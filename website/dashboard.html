<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your account</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <a class="brand" href="/">Manju</a>
  <div><a href="console.html">Build</a></div>
</nav>

<main class="dashboard">
  <div id="signed-out" hidden>
    <h1>Your account</h1>
    <p class="lede">No seed phrase. No password. Sign in and it is already there.</p>
    <button id="sign-in" class="button primary">Sign in</button>
  </div>

  <div id="signed-in" hidden>
    <h1>Your account</h1>
    <div class="address">
      <code id="address">…</code>
      <button id="copy" class="button">Copy</button>
    </div>
    <p class="hint">Send anything to this address. It exists whether or not it has been deployed.</p>

    <h2>Balances</h2>
    <ul id="balances" class="balances"></ul>

    <h2>History</h2>
    <ul id="history" class="history"></ul>
  </div>

  <p id="status" class="status"></p>
</main>

<script type="module" src="dashboard.js"></script>
</body>
</html>
