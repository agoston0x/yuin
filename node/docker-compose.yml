# One node is these three containers. Five of them, three agreeing, make a registration.
#
# Bee has to be a full node: GSOC subscription needs the chunk's neighbourhood, and a
# light node will subscribe without complaint and then hear nothing at all.
services:
  bee:
    image: ethersphere/bee:2.8.2
    restart: unless-stopped
    command: start
    environment:
      BEE_FULL_NODE: "true"
      BEE_API_ADDR: ":1633"
      BEE_P2P_ADDR: ":1634"
      BEE_SWAP_ENABLE: "true"
      BEE_PASSWORD: ${BEE_PASSWORD:?set BEE_PASSWORD}
      BEE_BLOCKCHAIN_RPC_ENDPOINT: ${GNOSIS_RPC:?set GNOSIS_RPC}
    volumes:
      - bee-data:/home/bee/.bee
    ports:
      - "${P2P_PORT:-1634}:1634"

  mail:
    build: ../mail
    restart: unless-stopped
    environment:
      SENDER_LABEL: ${SENDER_LABEL:-Manju}
      MAIL_PROVIDER_API_KEY: ${MAIL_PROVIDER_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PORT: 8710

  node:
    build: .
    restart: unless-stopped
    depends_on:
      - bee
      - mail
    env_file: .env
    environment:
      BEE_API: http://bee:1633
      MAIL_URL: http://mail:8710
    ports:
      - "${PORT:-8700}:8700"

volumes:
  bee-data:
